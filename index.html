<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a0e">
  <meta name="description" content="Marvel Archive: tracker personale delle edizioni italiane Marvel.">
  <title>Marvel Archive</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="logoMark">MA</div><div><strong>MARVEL ARCHIVE</strong><small id="logoSub">Reading tracker</small></div></div>
    <div><div class="label" style="margin-bottom:7px">Personaggi</div><div class="charGrid" id="charGrid"></div></div>
    <div class="card"><div class="label">Percorso del personaggio</div><div class="bigNum"><b id="doneCount">0</b>/<span id="totalCount">0</span></div><div class="progressTrack"><span id="progressBar"></span></div><div class="stats"><div class="stat"><b id="ownedCount">0</b><span>Recuperati</span></div><div class="stat"><b id="pct">0%</b><span>Completamento</span></div></div></div>
    <div class="seriesNav" id="seriesNav"></div>
    <div class="sideActions"><button id="jumpNext">→ Vai al prossimo albo</button><button id="showOptional">+ Mostra numeri facoltativi</button><button id="exportBtn">⇩ Esporta progressi</button><label>⇧ Importa progressi<input type="file" id="importFile" accept="application/json" hidden></label><button id="resetBtn">↺ Reset personaggio</button></div>
    <div class="footerNote" id="footerNote"></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="topbarTitle"><strong id="topTitle">Marvel Archive</strong><span id="topSub">Caricamento…</span></div><div class="search"><input id="search" type="search" placeholder="Cerca numero, titolo, evento, anno…"></div><button class="compactBtn" id="compactBtn">Vista compatta</button></header>
    <div class="content">
      <section class="hero"><article class="heroPanel"><div class="label" id="heroLabel">Percorso attivo</div><h1 id="heroTitle">Marvel Archive</h1><p id="heroDesc">Caricamento dati…</p></article><aside class="nextPanel" id="nextPanel"><div class="loading">Caricamento…</div></aside></section>
      <div class="route" id="route"></div>
      <div id="noticeWrap"></div>
      <div class="filterBar" id="filterBar"></div>
      <div id="seriesBlocks"><div class="loading">Caricamento personaggio…</div></div>
    </div>
  </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
