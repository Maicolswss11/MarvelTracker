name: Cleanup Avengers path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-avengers-path.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean timeline renderer and copy
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace(
              'return}const vis=visibleIssues(),order=',
              'return}const normalVis=visibleIssues(),order=',
              1,
          )
          app = app.replace(
              'const xs=vis.filter(i=>i.seriesId===s.id);',
              'const xs=normalVis.filter(i=>i.seriesId===s.id);',
              1,
          )
          app = app.replace('Personaggio sconosciuto:', 'Percorso sconosciuto:')
          app = app.replace('Riprova selezionando nuovamente il personaggio.', 'Riprova selezionando nuovamente il percorso.')
          app_path.write_text(app, encoding='utf-8')

          builder_path = Path('scripts/build_avengers_data.py')
          builder = builder_path.read_text(encoding='utf-8')
          builder = builder.replace(
              "normal_body = 'const vis=visibleIssues(),order=",
              "normal_body = 'const normalVis=visibleIssues(),order=",
              1,
          )
          builder = builder.replace(
              'const xs=vis.filter(i=>i.seriesId===s.id);',
              'const xs=normalVis.filter(i=>i.seriesId===s.id);',
              1,
          )
          builder_path.write_text(builder, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          replacements = {
              'Percorso del personaggio': 'Progresso del percorso',
              "passa da un eroe all'altro": "passa da un percorso all'altro",
              'aria-label="Personaggi disponibili"': 'aria-label="Percorsi disponibili"',
              'la lettura resta separata per ogni personaggio.': 'la lettura resta separata per ogni percorso.',
              'Caricamento personaggio…': 'Caricamento percorso…',
              'css/app.css?v=6': 'css/app.css?v=7',
              'js/app.js?v=6': 'js/app.js?v=7',
          }
          for old, new in replacements.items():
              index = index.replace(old, new)
          index_path.write_text(index, encoding='utf-8')

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Verify archives
        run: node scripts/verify-data.mjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html scripts/build_avengers_data.py
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Polish Avengers timeline integration"
          git push
