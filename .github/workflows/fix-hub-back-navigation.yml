name: Fix hub back navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hub-back-navigation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch deterministic back navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('js/hub-ui.js')
          source = path.read_text(encoding='utf-8')

          old = '''function returnHomeThen(callback){
            if(location.hash !== "#/home") location.hash = "#/home";
            requestAnimationFrame(()=>requestAnimationFrame(callback));
          }'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''let internalHomeNavigation = false;
          function goToExplorer(hubId=null){
            internalHomeNavigation = true;
            if(!document.body.classList.contains("homeActive")){
              const homeControl = byId("trackerHomeBtn") || byId("homeBtn");
              if(homeControl) homeControl.click();
              else location.hash = "#/home";
            }
            internalHomeNavigation = false;
            activeHubId = hubId || null;
            ensureHomeExplorer();
            openHub(activeHubId);
            byId("hubExplorer")?.scrollIntoView({behavior:"smooth",block:"start"});
          }'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old in source:
              source = source.replace(old,new,1)
          elif 'function goToExplorer(hubId=null)' not in source:
              raise SystemExit('returnHomeThen block not found')

          replacements = {
            'breadcrumb.querySelector("[data-tracker-home]").onclick=()=>returnHomeThen(()=>openHub(null));':
              'breadcrumb.querySelector("[data-tracker-home]").onclick=()=>goToExplorer(null);',
            'breadcrumb.querySelector("[data-tracker-parent]")?.addEventListener("click",event=>returnHomeThen(()=>openHub(event.currentTarget.dataset.trackerParent)));':
              'breadcrumb.querySelector("[data-tracker-parent]")?.addEventListener("click",event=>goToExplorer(event.currentTarget.dataset.trackerParent));',
            'breadcrumb.querySelector("[data-tracker-hub]").onclick=()=>returnHomeThen(()=>openHub(hub.id));':
              'breadcrumb.querySelector("[data-tracker-hub]").onclick=()=>goToExplorer(hub.id);',
            'nav.querySelector("[data-side-back]").onclick=()=>returnHomeThen(()=>openHub(hub.id));':
              'nav.querySelector("[data-side-back]").onclick=()=>goToExplorer(hub.id);'
          }
          for old_text,new_text in replacements.items():
              if old_text in source:
                  source = source.replace(old_text,new_text,1)
              elif new_text not in source:
                  raise SystemExit(f'navigation handler not found: {old_text}')

          old_home_listener='    ["homeBtn","trackerHomeBtn"].forEach(id=>byId(id)?.addEventListener("click",()=>{activeHubId=null},{capture:true}));'
          new_home_listener='''    ["homeBtn","trackerHomeBtn"].forEach(id=>byId(id)?.addEventListener("click",()=>{
              if(internalHomeNavigation) return;
              activeHubId=null;
              requestAnimationFrame(()=>{
                ensureHomeExplorer();
                openHub(null);
              });
            },{capture:true}));
            const exploreButton=byId("homeExplore");
            if(exploreButton) exploreButton.onclick=()=>goToExplorer(null);'''
          new_home_listener='\n'.join(line[10:] if line.startswith('          ') else line for line in new_home_listener.splitlines())
          if old_home_listener in source:
              source = source.replace(old_home_listener,new_home_listener,1)
          elif 'if(exploreButton) exploreButton.onclick=()=>goToExplorer(null);' not in source:
              raise SystemExit('home listener block not found')

          path.write_text(source,encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'js/hub-ui\.js\?v=\d+', 'js/hub-ui.js?v=4', html)
          html = re.sub(r'css/hub-ui\.css\?v=\d+', 'css/hub-ui.css?v=4', html)
          index.write_text(html,encoding='utf-8')

      - name: Validate navigation code
        run: |
          node --check js/hub-ui.js
          node --check js/app.js

      - name: Guard regression
        shell: python
        run: |
          from pathlib import Path
          source = Path('js/hub-ui.js').read_text(encoding='utf-8')
          assert 'returnHomeThen' not in source
          assert 'function goToExplorer(hubId=null)' in source
          assert 'if(exploreButton) exploreButton.onclick=()=>goToExplorer(null);' in source
          assert 'data-side-back' in source and 'goToExplorer(hub.id)' in source
          print('Hub back navigation — OK')

      - name: Verify archives
        run: node scripts/verify-data.mjs

      - name: Commit navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/hub-ui.js index.html
          git commit -m "Fix hierarchical back navigation"
          git push
