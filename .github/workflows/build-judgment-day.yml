name: Build Judgment Day event

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_judgment_day.py'
      - '.github/workflows/build-judgment-day.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build event data
        run: |
          python scripts/build_judgment_day.py
          python scripts/build_catalog.py
          node scripts/verify-data.mjs
      - name: Commit generated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/heroes/judgment-day.svg scripts/verify-data.mjs scripts/build_editions_catalog.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add complete A.X.E. Judgment Day event path"
          git pull --rebase origin main
          git push origin HEAD:main
