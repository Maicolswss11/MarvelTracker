name: Build collected editions catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-editions-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build collected editions catalog
        run: python scripts/build_editions_catalog.py
      - name: Validate catalog
        run: |
          python -m json.tool data/editions.json >/dev/null
          python - <<'PY'
          import json
          data=json.load(open('data/editions.json',encoding='utf-8'))
          assert data['version'] == 2
          assert data['total'] >= 1490, data['total']
          assert 'MINTGRXMEN' in data['series']
          assert 'MARINTTH' in data['series']
          credere=next(x for x in data['editions'] if x['id']=='MVNWCOL_P:12')
          assert credere['coverage'][0]['issueIds']==['IRONM3_P:1','IRONM3_P:2','IRONM3_P:3']
          print('editions',data['total'],'autoCovered',data['autoCovered'])
          PY
      - name: Commit generated catalog
        run: |
          rm -f .github/workflows/build-editions-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editions.json .github/workflows/build-editions-catalog.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add Marvel Integrale editions"
          git push
