name: Audit Iron Man route

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ironman-audit.yml"
      - "scripts/build_ironman_audit.py"
      - "scripts/build_ironman_audit_v2.py"
      - "scripts/build_ironman_audit_v3.py"
      - "scripts/refine_ironman_story_features.py"
      - "scripts/finalize_ironman_audit_metadata.py"
      - "scripts/patch_ironman_editions.py"
      - "scripts/verify-ironman-audit.mjs"
      - "js/editions.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ironman-audit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Iron Man from vol.1 #1
        run: python scripts/build_ironman_audit_v3.py --workers 20

      - name: Refine classic Iron Man to exact story features
        run: python scripts/refine_ironman_story_features.py --workers 20

      - name: Finalize Iron Man summary metadata
        run: python scripts/finalize_ironman_audit_metadata.py

      - name: Rebuild physical catalog
        run: python scripts/build_catalog.py

      - name: Apply exact Iron Man alternative editions
        run: python scripts/patch_ironman_editions.py --workers 16

      - name: Verify Iron Man audit
        run: node scripts/verify-ironman-audit.mjs

      - name: Verify alternative coverage and global data
        run: |
          python scripts/check_alternative_coverage.py
          node scripts/verify-data.mjs

      - name: Commit audited data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/characters.json \
            data/catalog.json \
            data/editions.json \
            data/characters/ironman.json \
            data/ironman-audit.json \
            data/ironman-alternatives-audit.json
          if git diff --cached --quiet; then
            echo "No Iron Man data changes to commit"
          else
            git commit -m "Rebuild Iron Man from vol.1 #1 with exact story coverage"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
