name: Add edition wishlist actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edition-wishlist-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_edition_actions.py
      - name: Validate JavaScript and cache bumps
        run: |
          node --check js/editions.js
          node --check js/app.js
          grep -q 'data-toggle-edition-wishlist' js/editions.js
          grep -q 'data-add-edition-list' js/editions.js
          grep -q 'onToggleWishlist:setEditionWishlist' js/app.js
          grep -q 'js/editions.js?v=6' index.html
          grep -q 'css/editions.css?v=3' index.html
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/editions.js js/app.js css/editions.css index.html
          git commit -m "Add wishlist actions to alternative editions"
          git pull --rebase origin main
          git push origin HEAD:main
