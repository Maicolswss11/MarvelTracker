name: Build street-level character wave

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-street-wave.yml"
      - "scripts/build_street_wave.py"
      - "scripts/verify-street-wave.mjs"
      - "data/street-wave-sources.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile scripts/build_street_wave.py

      - name: Build seven street-level paths
        env:
          MARVELTRACKER_WORKERS: "14"
        run: python scripts/build_street_wave.py --workers 14

      - name: Rebuild global physical catalog
        run: python scripts/build_catalog.py

      - name: Extend alternative-edition path aliases
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/build_editions_catalog.py")
          text = path.read_text(encoding="utf-8")
          aliases = {
              "luke-cage": ["luke cage", "power man"],
              "iron-fist": ["iron fist", "pugno d'acciaio"],
              "jessica-jones": ["jessica jones", "alias"],
              "punisher": ["punisher", "punitore", "frank castle"],
              "moon-knight": ["moon knight", "cavaliere della luna", "marc spector"],
          }
          start = text.index("PATH_ALIASES = {")
          end = text.index("\n}\n\nDETAIL_HINTS", start)
          block = text[start:end]
          additions = []
          for path_id, values in aliases.items():
              if f'"{path_id}":' in block:
                  continue
              rendered = ", ".join(repr(value) for value in values)
              additions.append(f'    "{path_id}": [{rendered}],')
          if additions:
              text = text[:end] + "\n" + "\n".join(additions) + text[end:]
          path.write_text(text, encoding="utf-8")

      - name: Regenerate alternative editions
        run: python scripts/build_editions_catalog.py

      - name: Verify alternative-edition regression test
        run: python scripts/check_alternative_coverage.py

      - name: Verify street wave
        run: node scripts/verify-street-wave.mjs

      - name: Verify global dataset
        run: node scripts/verify-data.mjs

      - name: Report audit summary
        shell: python
        run: |
          import json
          from pathlib import Path
          audit = json.loads(Path("data/street-wave-audit.json").read_text(encoding="utf-8"))
          print(json.dumps(audit["summary"], indent=2, ensure_ascii=False))
          for row in audit["paths"]:
              print(f"{row['id']}: {row['physicalItalianIssues']} physical issues, {row['mappedChapters']} mapped chapters, {row['missingItalianPublications']} missing Italian publications")
          if audit.get("sourceErrors"):
              print("SOURCE ERRORS")
              for code, error in audit["sourceErrors"].items():
                  print(f"- {code}: {error}")

      - name: Commit generated street wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/characters.json data/hubs.json data/catalog.json data/editions.json \
            data/street-wave-audit.json data/characters/ assets/heroes/ \
            scripts/build_editions_catalog.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Add complete street-level character wave"
          git push
