name: Apply Ultimate origins and audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ultimate-origins-audit.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Align manifest version
        shell: python
        run: |
          from pathlib import Path
          import re
          for path in Path('scripts').glob('*.py'):
              source = path.read_text(encoding='utf-8')
              source = re.sub(r'MANIFEST_VERSION\s*=\s*\d+', 'MANIFEST_VERSION = 10', source)
              source = re.sub(r'manifest\["version"\]\s*=\s*\d+', 'manifest["version"] = 10', source)
              path.write_text(source, encoding='utf-8')
          verify = Path('scripts/verify-data.mjs')
          source = verify.read_text(encoding='utf-8')
          source = re.sub(
              r'assert\.equal\(manifest\.version,\s*\d+,\s*"Il manifest deve usare la versione cache v\d+"\);',
              'assert.equal(manifest.version, 10, "Il manifest deve usare la versione cache v10");',
              source,
          )
          verify.write_text(source, encoding='utf-8')

      - name: Rebuild Ultimate core
        run: python scripts/build_ultimate_classic_core.py

      - name: Rebuild Ultimate extras
        run: python scripts/build_ultimate_classic_extras.py

      - name: Add origins and audit timeline
        run: python scripts/build_ultimate_origins_and_audit.py

      - name: Validate Ultimate structure
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path

          manifest=json.loads(Path('data/characters.json').read_text(encoding='utf-8'))
          hubs=json.loads(Path('data/hubs.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('data/ultimate-audit.json').read_text(encoding='utf-8'))
          assert manifest['version']==10
          paths={item['id']:item for item in manifest['characters']}
          expected={
              'ultimate-universe':317,
              'ultimate-origins':1,
              'ultimate-thor':2,
              'ultimate-cap':4,
              'ultimate-cataclysm':7,
          }
          for key,count in expected.items(): assert paths[key]['totalRequired']==count,(key,paths[key]['totalRequired'])
          assert 'ultimate-origins-annuals' not in paths
          hub=next(item for item in hubs['hubs'] if item['id']=='ultimate-classic')
          origins=next(group for group in hub['groups'] if group['id']=='origins')
          events=next(group for group in hub['groups'] if group['id']=='events')
          assert origins['paths']==['ultimate-origins','ultimate-ironman','ultimate-thor','ultimate-cap']
          assert 'ultimate-cataclysm' in events['paths']
          assert audit['masterTotal']==317

          def unpack(cid):
              spec=json.loads(Path(f'data/encoded/{cid}.json').read_text(encoding='utf-8'))
              encoded=''.join(Path(src).read_text(encoding='ascii').strip() for src in spec['sources'])
              return json.loads(gzip.decompress(base64.b64decode(encoded)).decode('utf-8'))

          master=unpack('ultimate-universe')
          ids=[item['id'] for item in master['issues']]
          cat=['MWORLD_M:23','MWORLD_M:24','MWORLD_M:25','ULTC_SM_M:28','ULTCM_M:28','UCAV_M:28','MWORLD_M:26']
          positions=[ids.index(item) for item in cat]
          assert positions==sorted(positions),positions
          assert all(item in ids for item in audit['addedPhysicalIssues'])
          thor=unpack('ultimate-thor')
          assert [i['id'] for i in thor['issues']]==['ULTCM_M:1','ULTCM_M:2']
          origins_path=unpack('ultimate-origins')
          assert [i['id'] for i in origins_path['issues']]==['MCROS_M:54']
          print('Ultimate origins/audit taxonomy — OK')

      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/hub-ui.js

      - name: Verify all archives
        run: node scripts/verify-data.mjs

      - name: Commit Ultimate origins audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/hubs.json data/ultimate-audit.json
          git add data/characters/ultimate-*.json data/characters/ultimates.json
          git add data/encoded/ultimate-*.json data/encoded/ultimates.json
          git add data/b64/ultimate-*.b64 data/b64/ultimates-*.b64
          git add assets/heroes/ultimate-*.svg
          git add scripts/*.py scripts/verify-data.mjs
          git commit -m "Add Ultimate origins and audit crossover timeline"
          git push
