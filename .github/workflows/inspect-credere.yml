name: Inspect Iron Man Credere mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-credere.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Credere issues
        run: |
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          root=Path('.')
          spec=json.loads((root/'data/encoded/ironman.json').read_text())
          enc=''.join((root/p).read_text().strip() for p in spec['sources'])
          data=json.loads(gzip.decompress(base64.b64decode(enc)).decode())
          print('TOTAL',len(data['issues']))
          needles=('credere','demoni','gentiluomini','rende più forti','rende piu forti','paura del vuoto','uomini di mondo')
          for i in data['issues']:
              text=' '.join(str(i.get(k,'')) for k in ('name','title','instruction','era','eraSub')).lower()
              if any(n in text for n in needles) or (i.get('seriesId')=='IRONM3_P' and int(i.get('n',999))<=6):
                  print(json.dumps({k:i.get(k) for k in ('id','seq','seriesId','series','n','name','title','date','era','instruction','url')},ensure_ascii=False))
          PY
