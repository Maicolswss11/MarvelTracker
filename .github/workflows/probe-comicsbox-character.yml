name: Probe ComicsBox character chronology

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-comicsbox-character.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sample character page
        shell: python
        run: |
          import re
          from html import unescape
          from urllib.request import Request, urlopen

          url = "https://www.comicsbox.it/personaggio/quicksillver"
          req = Request(url, headers={"User-Agent": "MarvelTracker data maintenance/5.0"})
          source = urlopen(req, timeout=45).read().decode("utf-8", errors="replace")
          print("bytes", len(source))
          links = []
          for match in re.finditer(r'href=["\']([^"\']+)["\']', source, re.I):
              href = unescape(match.group(1))
              if href not in links:
                  links.append(href)
          print("albo links", [x for x in links if "albo" in x.lower()][:40])
          print("serie links", [x for x in links if "serie" in x.lower()][:40])
          for needle in ["cronol", "ajax", "quicks", "personaggio", "AVEN", "XMEN", "albo"]:
              positions = [m.start() for m in re.finditer(needle, source, re.I)]
              print("\n===", needle, positions[:8], "===")
              for pos in positions[:2]:
                  snippet = re.sub(r"\s+", " ", source[max(0,pos-500):pos+1200])
                  print(snippet[:1800])
