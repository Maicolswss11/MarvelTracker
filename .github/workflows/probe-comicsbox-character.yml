name: Probe ComicsBox character chronology

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-comicsbox-character.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve relevant series codes from ComicsBox indexes
        shell: python
        run: |
          import html
          import re
          from urllib.request import Request, urlopen

          needles = [
              "BLACK CAT", "MARY JANE & BLACK CAT", "FALCON", "WAR MACHINE",
              "SPIDER-WOMAN", "SPIDER WOMAN", "HERCULES", "TALES OF SUSPENSE",
              "SENTRY", "QUICKSILVER",
          ]
          for letter in "BFGHMQSTW":
              url = f"https://www.comicsbox.it/comicsusa?l={letter}"
              request = Request(url, headers={"User-Agent": "MarvelTracker data maintenance/5.0"})
              source = urlopen(request, timeout=45).read().decode("utf-8", errors="replace")
              for match in re.finditer(r'href=["\'](?:https?://www\.comicsbox\.it)?/?serie/([^"\'?&]+)[^"\']*["\'][^>]*>(.*?)</a>', source, re.I | re.S):
                  code = html.unescape(match.group(1))
                  title = re.sub(r"<[^>]+>", "", match.group(2))
                  title = " ".join(html.unescape(title).split())
                  upper = title.upper()
                  if any(needle in upper for needle in needles):
                      print(f"{title:60} | {code}")
