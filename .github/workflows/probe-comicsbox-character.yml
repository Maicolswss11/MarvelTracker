name: Probe ComicsBox character chronology

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-comicsbox-character.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch legacy character chronology
        shell: python
        run: |
          import re
          from urllib.request import Request, urlopen

          for slug in ["quicksillver", "spiderwoman", "sentry2"]:
              url = f"https://www.comicsbox.it/personaggio.php?limite=0&name={slug}"
              req = Request(url, headers={"User-Agent": "Mozilla/5.0 MarvelTracker/5.0"})
              source = urlopen(req, timeout=45).read().decode("utf-8", errors="replace")
              print("\n=====", slug, "bytes", len(source), "=====")
              for needle in ["Prima pubblicazione", "Pubblicazione italiana", "fa solo una comparsa", "/albo/"]:
                  positions = [m.start() for m in re.finditer(re.escape(needle), source, re.I)]
                  print(needle, len(positions), positions[:5])
              pos = source.lower().find("prima pubblicazione")
              if pos >= 0:
                  print(re.sub(r"\s+", " ", source[max(0,pos-1500):pos+4500])[:6000])
