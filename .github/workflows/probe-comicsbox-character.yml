name: Probe ComicsBox character chronology

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-comicsbox-character.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sample character page
        shell: python
        run: |
          import re
          from urllib.request import Request, urlopen

          url = "https://www.comicsbox.it/personaggio/quicksillver"
          req = Request(url, headers={"User-Agent": "MarvelTracker data maintenance/5.0"})
          html = urlopen(req, timeout=45).read().decode("utf-8", errors="replace")
          print("bytes", len(html))
          for needle in ["QUICK", "Avengers vol 1 # 17", "Prima pubblicazione", "Pubblicazione italiana"]:
              pos = html.find(needle)
              print("\n===", needle, pos, "===")
              if pos >= 0:
                  snippet = html[max(0,pos-1200):pos+3000]
                  snippet = re.sub(r"\s+", " ", snippet)
                  print(snippet)
