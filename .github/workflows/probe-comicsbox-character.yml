name: Probe ComicsBox character chronology

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-comicsbox-character.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Audit candidate series codes
        shell: python
        run: |
          import json
          import sys
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          sys.path.insert(0, str(Path("scripts").resolve()))
          import build_cosmic_supernatural_expansion as legacy

          config = json.loads(Path("data/character-wave1-sources.json").read_text(encoding="utf-8"))
          owner = {}
          for path in config["paths"]:
              for code in path.get("sources", []):
                  owner.setdefault(code, []).append(path["id"])
          results = {}
          with ThreadPoolExecutor(max_workers=14) as pool:
              futures = {pool.submit(legacy.load_foreign_series, code): code for code in sorted(owner)}
              for future in as_completed(futures):
                  code = futures[future]
                  try:
                      item = future.result()
                      results[code] = ("OK", item.get("name", ""), len(item.get("rows", [])))
                  except Exception as error:
                      results[code] = ("ERR", str(error), 0)
          for code in sorted(results):
              status, detail, count = results[code]
              print(f"{','.join(owner[code]):18} | {code:16} | {status:3} | {count:3} | {detail}")
