name: Apply Ultimate classic core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ultimate-classic-core.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Align cache version and UI labels
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in Path('scripts').glob('*.py'):
              source = path.read_text(encoding='utf-8')
              source = re.sub(r'MANIFEST_VERSION\s*=\s*\d+', 'MANIFEST_VERSION = 8', source)
              source = re.sub(r'manifest\["version"\]\s*=\s*\d+', 'manifest["version"] = 8', source)
              path.write_text(source, encoding='utf-8')

          verify = Path('scripts/verify-data.mjs')
          source = verify.read_text(encoding='utf-8')
          source = re.sub(
              r'assert\.equal\(manifest\.version,\s*\d+,\s*"Il manifest deve usare la versione cache v\d+"\);',
              'assert.equal(manifest.version, 8, "Il manifest deve usare la versione cache v8");',
              source,
          )
          verify.write_text(source, encoding='utf-8')

          ui = Path('js/hub-ui.js')
          source = ui.read_text(encoding='utf-8')
          old = 'function pathTypeLabel(path){ return path?.type === "team" ? "Squadra" : "Personaggio"; }'
          new = '''function pathTypeLabel(path){
            const labels={team:"Squadra",character:"Personaggio",universe:"Percorso universo",event:"Evento",collection:"Percorso"};
            return labels[path?.type] || "Percorso";
          }'''
          if old in source:
              source = source.replace(old,new,1)
          elif 'universe:"Percorso universo"' not in source:
              raise SystemExit('pathTypeLabel non trovato')
          ui.write_text(source, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'js/hub-ui\.js\?v=\d+', 'js/hub-ui.js?v=6', html)
          html = re.sub(r'css/hub-ui\.css\?v=\d+', 'css/hub-ui.css?v=6', html)
          index.write_text(html, encoding='utf-8')

      - name: Build Ultimate classic core
        run: python scripts/build_ultimate_classic_core.py

      - name: Validate taxonomy and counts
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/characters.json').read_text(encoding='utf-8'))
          hubs=json.loads(Path('data/hubs.json').read_text(encoding='utf-8'))
          assert manifest['version']==8
          paths={item['id']:item for item in manifest['characters']}
          hub=next(item for item in hubs['hubs'] if item['id']=='ultimate-classic')
          assert hub['featuredPath']=='ultimate-universe'
          assert paths['ultimate-spiderman-classic']['totalRequired']==110
          assert paths['ultimate-xmen']['totalRequired']==74
          assert paths['ultimates']['totalRequired']==78
          assert paths['ultimate-fantastic-four']['totalRequired']==33
          assert paths['ultimate-universe']['totalRequired']==292
          assert hub['groups'][0]['paths']==['ultimate-universe']
          print('Ultimate hub taxonomy — OK')
          for key in ['ultimate-universe','ultimate-spiderman-classic','ultimate-xmen','ultimates','ultimate-fantastic-four']:
              print(key, paths[key]['totalRequired'])

      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/hub-ui.js

      - name: Verify all archives
        run: node scripts/verify-data.mjs

      - name: Commit Ultimate core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/hubs.json
          git add data/characters/ultimate-*.json data/characters/ultimates.json
          git add data/encoded/ultimate-*.json data/encoded/ultimates.json
          git add data/b64/ultimate-*.b64 data/b64/ultimates-*.b64
          git add assets/heroes/ultimate-*.svg assets/heroes/ultimates.svg
          git add scripts/*.py scripts/verify-data.mjs js/hub-ui.js index.html
          git commit -m "Expand classic Ultimate Universe reading paths"
          git push
