name: Apply profile catalog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-profile-catalog.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply profile integration
        run: python scripts/apply_profile_integration.py

      - name: Build global catalog
        run: python scripts/build_catalog.py

      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/profile-ui.js
          node --check js/hub-ui.js

      - name: Validate all archives
        run: node scripts/verify-data.mjs

      - name: Validate global catalog
        run: |
          python -c "import json; from pathlib import Path; d=json.loads(Path('data/catalog.json').read_text(encoding='utf-8')); ids=[x['id'] for x in d['issues']]; assert d['version']==1; assert d['manifestVersion']==11; assert len(ids)==len(set(ids))==d['total']; assert d['total']>1000; print('Catalogo globale:',d['total'],'albi unici - OK')"
          grep -q 'id="profileView"' index.html
          grep -q 'id="homeProfileBtn"' index.html
          grep -q 'id="trackerProfileBtn"' index.html
          grep -q 'view:"profile"' js/app.js

      - name: Commit profile catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html data/catalog.json
          git commit -m "Add global collection profile"
          git push
