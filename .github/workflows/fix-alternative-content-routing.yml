name: Fix Magik Omnibus alternative

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-alternative-content-routing.yml"
      - "scripts/check_magik_alternatives.py"
      - "scripts/fix_magik_omnibus_65.py"
      - "scripts/prepare_comicsbox_transient_fix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Harden ComicsBox pagination
        run: |
          python scripts/prepare_comicsbox_transient_fix.py
          python -m py_compile scripts/build_editions_catalog.py

      - name: Verify ComicsBox source mapping
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import build_editions_catalog as editions

          source = editions.fetch('https://www.comicsbox.it/albo/MAROMNIB_065')
          pairs = editions.first_italian_pairs(source)
          required = {('MAGK1_001', 'PB_PP_003'), ('MAGK1_002', 'PB_PP_003'), ('MAGK1_003', 'PB_PP_003'), ('MAGK1_004', 'PB_PP_003')}
          missing = required.difference(pairs)
          print('Marvel Omnibus #65 Magik/Play Book pairs:', sorted(required.intersection(pairs)))
          if missing:
              raise SystemExit(f'missing verified ComicsBox pairs: {sorted(missing)}')
          PY

      - name: Restore exact alternative and run regressions
        run: |
          python scripts/fix_magik_omnibus_65.py
          python scripts/check_alternative_coverage.py
          python scripts/check_magik_alternatives.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_editions_catalog.py data/editions.json
          if ! git diff --cached --quiet; then
            git commit -m "Fix Magik Marvel Omnibus alternative"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
