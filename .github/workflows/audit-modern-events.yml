name: Audit modern event Italian editions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-modern-events.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Marvel Miniserie and collected editions
        run: |
          python - <<'PY'
          import html,re,urllib.request
          from html.parser import HTMLParser
          from urllib.parse import unquote

          KEYWORDS=('house of m','civil war','secret invasion','assedio','siege','fear itself','avx','avengers vs','avengers contro x-men')
          SERIES=('MMMI','MARVELMUST','MAROMNIB','MARVDELUXE','MVNWCOL_P')
          UA='MarvelTracker event audit/1.0'
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.rows=[]; self.intr=False; self.intd=False; self.cells=[]; self.buf=[]; self.href=''
              def handle_starttag(self,t,a):
                  a=dict(a)
                  if t=='tr': self.intr=True; self.cells=[]; self.href=''
                  elif t=='td' and self.intr: self.intd=True; self.buf=[]
                  elif t=='a' and self.intd and not self.href:
                      h=a.get('href') or ''
                      if 'albo/' in h: self.href=h
              def handle_data(self,d):
                  if self.intd: self.buf.append(d)
              def handle_endtag(self,t):
                  if t=='td' and self.intd: self.cells.append(' '.join(''.join(self.buf).split())); self.intd=False
                  elif t=='tr' and self.intr:
                      self.intr=False
                      if self.href and len(self.cells)>=4: self.rows.append((self.cells[0],self.cells[1],self.cells[2],self.cells[3],self.href))
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Language':'it-IT,it;q=0.9'})
              with urllib.request.urlopen(req,timeout=45) as r: return r.read().decode('utf-8','replace')
          for series in SERIES:
              print('\n##',series)
              seen=set()
              for off in range(0,1000,50):
                  p=P(); p.feed(fetch(f'https://www.comicsbox.it/serie.php?limite={off}&serie={series}'))
                  fresh=0
                  for row in p.rows:
                      key=row[-1]
                      if key in seen: continue
                      seen.add(key); fresh+=1
                      text=' '.join(row[:-1]).casefold()
                      if any(k in text for k in KEYWORDS): print(' | '.join(row[:-1]), '|',row[-1])
                  if fresh==0: break
          PY
