name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild global issue catalog
        run: python scripts/build_catalog.py
      - name: Verify global search index
        run: node scripts/verify-global-search.mjs
      - name: Verify Marvel 2099 universe
        run: node scripts/verify-marvel-2099.mjs
      - name: Verify Marvel Zombies universe
        run: node scripts/verify-marvel-zombies.mjs
      - name: Verify character biographies
        run: node scripts/verify-character-profiles.mjs
      - name: Verify team and event dossiers
        run: node scripts/verify-editorial-profiles.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
