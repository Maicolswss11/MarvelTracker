name: Apply tracker readability redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tracker-readability.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply narrative-order UI redesign
        run: python scripts/refine_tracker_readability.py

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Verify compressed archives
        run: node scripts/verify-data.mjs

      - name: Commit redesigned tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/app.css data/encoded/ironman.json data/b64/ironman-*.b64
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Redesign tracker around narrative reading order"
          git push
