name: Audit Judgment Day candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-judgment-day.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print 2022-2023 crossover candidates
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          root=Path('.')
          manifest=json.loads((root/'data/characters.json').read_text(encoding='utf-8'))
          wanted={'xmen','avengers','fantastic-four','spiderman','captainmarvel'}
          months=('Novembre 2022','Dicembre 2022','Gennaio 2023','Febbraio 2023','Marzo 2023','Aprile 2023')
          for meta in manifest['characters']:
              if meta['id'] not in wanted: continue
              stub=json.loads((root/meta['data']).read_text(encoding='utf-8'))
              obj=stub
              if isinstance(stub.get('issueSources'),list):
                  spec=json.loads((root/f"data/encoded/{meta['id']}.json").read_text(encoding='utf-8'))
                  raw=''.join((root/p).read_text(encoding='ascii').strip() for p in spec['sources'])
                  obj=json.loads(gzip.decompress(base64.b64decode(raw)).decode('utf-8'))
              print(f"\n## {meta['id']}")
              for issue in obj.get('issues',[]):
                  text=' | '.join(str(issue.get(k,'')) for k in ('date','name','title','era','eraSub','instruction'))
                  if any(m in text for m in months) or 'judgment' in text.casefold() or 'a.x.e' in text.casefold():
                      print(json.dumps({k:issue.get(k) for k in ('id','n','name','title','date','seriesId','series','url','era','instruction')},ensure_ascii=False))
          PY
