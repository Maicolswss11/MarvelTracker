name: Apply X-Men main path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-xmen-path.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build X-Men reading path
        run: python scripts/build_xmen_data.py

      - name: Validate hub taxonomy
        shell: python
        run: |
          import json
          from pathlib import Path
          hubs = json.loads(Path('data/hubs.json').read_text(encoding='utf-8'))
          paths = json.loads(Path('data/characters.json').read_text(encoding='utf-8'))
          hub_ids = {hub['id'] for hub in hubs['hubs']}
          path_ids = {path['id'] for path in paths['characters']}
          for path in paths['characters']:
              for hub_id in path.get('hubs', []): assert hub_id in hub_ids, (path['id'], hub_id)
              if path.get('primaryHub'): assert path['primaryHub'] in hub_ids, path['id']
          for hub in hubs['hubs']:
              if hub.get('parent'): assert hub['parent'] in hub_ids, hub['id']
              for group in hub.get('groups', []):
                  for path_id in group.get('paths', []): assert path_id in path_ids, (hub['id'], path_id)
          xmen = next(path for path in paths['characters'] if path['id'] == 'xmen')
          xhub = next(hub for hub in hubs['hubs'] if hub['id'] == 'xmen')
          assert xhub.get('featuredPath') == 'xmen'
          assert 'status' not in xhub
          print(f"{len(hub_ids)} hub, {len(path_ids)} percorsi; X-Men {xmen['totalRequired']} tappe — OK")

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/hub-ui.js

      - name: Verify all archives
        run: node scripts/verify-data.mjs

      - name: Commit generated X-Men data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/hubs.json data/characters/xmen.json data/encoded/xmen.json data/b64/xmen-*.b64 assets/heroes/xmen.svg
          git add scripts/verify-data.mjs scripts/rebuild_character_data.py scripts/build_avengers_data.py scripts/build_avengers_characters.py
          git commit -m "Add X-Men main reading path"
          git push
