name: Apply Ultimate classic extras

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ultimate-classic-extras.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Align manifest version
        shell: python
        run: |
          from pathlib import Path
          import re
          for path in Path('scripts').glob('*.py'):
              source = path.read_text(encoding='utf-8')
              source = re.sub(r'MANIFEST_VERSION\s*=\s*\d+', 'MANIFEST_VERSION = 9', source)
              source = re.sub(r'manifest\["version"\]\s*=\s*\d+', 'manifest["version"] = 9', source)
              path.write_text(source, encoding='utf-8')
          verify = Path('scripts/verify-data.mjs')
          source = verify.read_text(encoding='utf-8')
          source = re.sub(
              r'assert\.equal\(manifest\.version,\s*\d+,\s*"Il manifest deve usare la versione cache v\d+"\);',
              'assert.equal(manifest.version, 9, "Il manifest deve usare la versione cache v9");',
              source,
          )
          verify.write_text(source, encoding='utf-8')

      - name: Rebuild Ultimate core
        run: python scripts/build_ultimate_classic_core.py

      - name: Add events and miniseries
        run: python scripts/build_ultimate_classic_extras.py

      - name: Validate Ultimate taxonomy
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/characters.json').read_text(encoding='utf-8'))
          hubs=json.loads(Path('data/hubs.json').read_text(encoding='utf-8'))
          assert manifest['version']==9
          paths={item['id']:item for item in manifest['characters']}
          expected={
              'ultimate-universe':313,
              'ultimate-team-up':4,
              'ultimate-specials':3,
              'ultimate-ironman':4,
              'ultimate-origins-annuals':2,
              'ultimate-wolverine':2,
              'ultimate-doomsday':3,
              'ultimate-post-cataclysm':3,
          }
          for key,count in expected.items():
              assert paths[key]['totalRequired']==count,(key,paths[key]['totalRequired'])
          hub=next(item for item in hubs['hubs'] if item['id']=='ultimate-classic')
          events=next(group for group in hub['groups'] if group['id']=='events')
          assert len(events['paths'])==7
          assert hub['featuredPath']=='ultimate-universe'
          print('Ultimate extras taxonomy — OK')
          for key,count in expected.items(): print(key,count)

      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/hub-ui.js

      - name: Verify all archives
        run: node scripts/verify-data.mjs

      - name: Commit Ultimate extras
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/hubs.json
          git add data/characters/ultimate-*.json data/characters/ultimates.json
          git add data/encoded/ultimate-*.json data/encoded/ultimates.json
          git add data/b64/ultimate-*.b64 data/b64/ultimates-*.b64
          git add scripts/*.py scripts/verify-data.mjs
          git commit -m "Complete classic Ultimate Universe core reading map"
          git push
