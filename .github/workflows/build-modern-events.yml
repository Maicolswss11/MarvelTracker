name: Build modern Marvel events

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_modern_events.py'
      - '.github/workflows/build-modern-events.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build event paths
        run: |
          python scripts/build_modern_events.py
          python scripts/build_catalog.py
          node scripts/verify-data.mjs
      - name: Validate event scopes and collection mappings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'data/characters.json').read_text(encoding='utf-8'))
          assert manifest['version']==15
          ids={x['id'] for x in manifest['characters']}
          events=['house-of-m','civil-war','secret-invasion','siege','fear-itself','avengers-vs-xmen','judgment-day']
          assert all(x in ids for x in events)
          hubs=json.loads((root/'data/hubs.json').read_text(encoding='utf-8'))
          eh=next(x for x in hubs['hubs'] if x['id']=='events')
          flat=[p for g in eh['groups'] for p in g['paths']]
          assert all(x in flat for x in events)
          curated=json.loads((root/'data/curated-editions.json').read_text(encoding='utf-8'))
          byid={x['id']:x for x in curated['editions']}
          checks={
              'MARVELMUST:26':'house-of-m','MARVELMUST:1':'civil-war','MARVELMUST:42':'secret-invasion',
              'MARVELMUST:37':'siege','MARVELMUST:48':'fear-itself','MAROMNIB:31':'avengers-vs-xmen'
          }
          for eid,path in checks.items():
              assert any(c['path']==path for c in byid[eid]['coverage']), (eid,path)
          avx=json.loads((root/'data/characters/avengers-vs-xmen.json').read_text(encoding='utf-8'))
          assert avx['totalRequired']==7 and len(avx['issues'])==9
          print('Event hub and alternative-edition mappings — OK')
          PY
      - name: Commit generated event archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/heroes scripts/build_editions_catalog.py scripts/verify-data.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add modern Marvel event paths"
          git pull --rebase origin main
          git push origin HEAD:main
