name: Clean up Civil War build workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-civil-war-complete.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-civil-war-complete.yml
          git commit -m "Remove one-time Civil War build workflow"
          git push origin HEAD:main
