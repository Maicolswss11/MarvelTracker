name: Set up Marvel Archive app icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PWA manifest and launcher icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json, struct

          icons = {
            'assets/app-icons/icon-192.png': '',
            'assets/app-icons/icon-512.png': ''
          }

          for name, payload in icons.items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(payload))

          manifest = {
            'id': './',
            'name': 'Marvel Archive',
            'short_name': 'Marvel Archive',
            'description': 'Tracker personale delle edizioni italiane Marvel.',
            'start_url': './',
            'scope': './',
            'display': 'standalone',
            'background_color': '#070a0e',
            'theme_color': '#070a0e',
            'prefer_related_applications': False,
            'icons': [
              {'src': 'assets/app-icons/icon-192.png?v=1', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any maskable'},
              {'src': 'assets/app-icons/icon-512.png?v=1', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          block = '''  <!-- PWA: launcher identity -->\n  <link rel="manifest" href="manifest.webmanifest?v=1">\n  <link rel="icon" type="image/png" sizes="192x192" href="assets/app-icons/icon-192.png?v=1">\n  <link rel="apple-touch-icon" sizes="192x192" href="assets/app-icons/icon-192.png?v=1">\n  <meta name="application-name" content="Marvel Archive">\n  <meta name="mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-title" content="Marvel Archive">\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n  <!-- /PWA -->\n'''
          start = text.find('  <!-- PWA: launcher identity -->')
          if start != -1:
              end = text.find('  <!-- /PWA -->', start)
              if end == -1:
                  raise RuntimeError('PWA block malformed')
              end += len('  <!-- /PWA -->\n')
              text = text[:start] + text[end:]
          marker = '  <title>Marvel Archive</title>\n'
          if marker not in text:
              raise RuntimeError('Title marker not found')
          text = text.replace(marker, marker + block, 1)
          index.write_text(text, encoding='utf-8')

          for path, expected in [('assets/app-icons/icon-192.png', 192), ('assets/app-icons/icon-512.png', 512)]:
              raw = Path(path).read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n'
              w, h = struct.unpack('>II', raw[16:24])
              assert (w, h) == (expected, expected), (path, w, h)
          print('PWA manifest + launcher icons OK')
          PY
      - name: Commit PWA assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest assets/app-icons
          git commit -m "Add Marvel Archive launcher icons"
          git pull --rebase origin main
          git push origin HEAD:main
