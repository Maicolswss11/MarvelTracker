name: Build complete Secret Invasion event

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_secret_invasion_complete.py'
      - '.github/workflows/build-secret-invasion-complete.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build complete Secret Invasion route
        run: |
          python -m py_compile scripts/build_secret_invasion_complete.py
          python scripts/build_secret_invasion_complete.py
          python scripts/build_catalog.py
          node --check js/app.js
          node scripts/verify-data.mjs

      - name: Validate complete event mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root/'data/characters.json').read_text(encoding='utf-8'))
          assert manifest['version'] == 18
          meta = next(x for x in manifest['characters'] if x['id'] == 'secret-invasion')
          assert meta['totalRequired'] == 62
          assert 'evento completo' in meta['subtitle']

          event = json.loads((root/'data/characters/secret-invasion.json').read_text(encoding='utf-8'))
          assert event['eventScope'] == 'complete'
          assert len(event['readingOrder']) == 98
          assert event['totalRequired'] == event['availableTotal'] == 62
          assert len(event['issues']) == 62
          ids = [x['id'] for x in event['issues']]
          assert len(ids) == len(set(ids)) == 62
          assert 'XM_SM:229' not in ids, 'X-Men #2 non è nella reading list ufficiale usata'
          assert 'THORVE_M:109' in ids and 'MMMI:101' in ids

          catalog = json.loads((root/'data/catalog.json').read_text(encoding='utf-8'))
          catalog_ids = {x['id'] for x in catalog['issues']}
          assert set(ids) <= catalog_ids

          hubs = json.loads((root/'data/hubs.json').read_text(encoding='utf-8'))
          event_hub = next(x for x in hubs['hubs'] if x['id'] == 'events')
          groups = {x['id']: x for x in event_hub['groups']}
          assert 'secret-invasion' not in groups['modern-core-1']['paths']
          assert 'secret-invasion' in groups['complete']['paths']

          editions = json.loads((root/'data/editions.json').read_text(encoding='utf-8'))
          by_id = {x['id']: x for x in editions['editions']}
          def coverage(eid):
              return next(x for x in by_id[eid]['coverage'] if x['path'] == 'secret-invasion')['issueIds']
          omni15 = coverage('MAROMNIB:15')
          omni208 = coverage('MAROMNIB:208')
          assert all(f'MMMI:{n}' in omni15 for n in range(93,101))
          assert 'THORVE_M:119' in omni15
          assert 'THORVE_M:119' in omni208 and 'MMMI:101' in omni208
          assert 'THORVE_M:109' not in omni208

          print('Secret Invasion complete route — 98 US chapters / 62 Italian publications — OK')
          PY

      - name: Commit generated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Upgrade Secret Invasion to complete event path"
          git push origin HEAD:main
