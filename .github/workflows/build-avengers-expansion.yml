name: Build Avengers expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-avengers-expansion.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build new Avengers paths
        run: python scripts/build_avengers_expansion.py

      - name: Rebuild catalog
        run: python scripts/build_catalog.py

      - name: Validate data
        run: node scripts/verify-data.mjs

      - name: Commit generated paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/heroes
          git diff --cached --quiet && exit 0
          git commit -m "Add Hawkeye Black Widow Black Panther Captain Marvel and She-Hulk paths"
          git push
