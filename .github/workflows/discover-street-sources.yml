name: Discover ComicsBox street sources

on:
  push:
    paths:
      - ".github/workflows/discover-street-sources.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect ComicsBox publication links
        shell: python
        run: |
          import html
          import re
          import urllib.request

          pages = {letter: f"https://www.comicsbox.it/comicsusa?l={letter}" for letter in ["B","P"]}
          needles = [
              "BLACK WIDOW: WIDOW'S STING",
              "PUNISHER WAR JOURNAL: BASE",
              "PUNISHER WAR JOURNAL: BROTHER",
          ]
          for label, url in pages.items():
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0", "Accept-Language":"it-IT,it;q=0.9"})
              text = urllib.request.urlopen(req, timeout=50).read().decode("utf-8", "replace")
              print("PAGE", label, "bytes", len(text))
              for href, body in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, re.I|re.S):
                  title = re.sub(r'<[^>]+>', ' ', body)
                  title = html.unescape(re.sub(r'\s+', ' ', title)).strip()
                  if title.upper() in needles:
                      print(f"MATCH\t{title}\t{html.unescape(href)}")
