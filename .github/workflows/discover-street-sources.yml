name: Discover ComicsBox street sources

on:
  push:
    paths:
      - ".github/workflows/discover-street-sources.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect ComicsBox publication links
        shell: python
        run: |
          import html
          import re
          import urllib.request

          pages = {
              "luke": "https://www.comicsbox.it/personaggio/cage_luke",
              "W": "https://www.comicsbox.it/comicsusa?l=W",
          }
          needles = [
              "GIANT-SIZE POWER MAN", "LUKE CAGE - POWER MAN ANNUAL",
              "HEROES FOR HIRE / QUICKSILVER ANNUAL 1998",
              "AVENGERS ORIGINS: LUKE CAGE", "CAGE VOL 3", "LUKE CAGE VOL 2",
              "WEB OF BLACK WIDOW",
          ]
          for label, url in pages.items():
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0", "Accept-Language":"it-IT,it;q=0.9"})
              text = urllib.request.urlopen(req, timeout=50).read().decode("utf-8", "replace")
              print("PAGE", label, "bytes", len(text))
              links = []
              for href, body in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, re.I|re.S):
                  title = re.sub(r'<[^>]+>', ' ', body)
                  title = html.unescape(re.sub(r'\s+', ' ', title)).strip()
                  upper = title.upper()
                  if any(n in upper for n in needles):
                      links.append((title, html.unescape(href)))
              for title, href in links:
                  print(f"MATCH\t{title}\t{href}")
