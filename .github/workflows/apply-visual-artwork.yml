name: Apply visual artwork

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-visual-artwork.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply visual integration
        run: python scripts/apply_visual_artwork.py

      - name: Build lightweight UI artwork index
        run: python scripts/build_catalog.py

      - name: Replace main Marvel mark with Wikimedia PNG
        run: |
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 MarvelArchive/1.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Marvel_Logo.png' \
            -o assets/brand/marvel.png
          file assets/brand/marvel.png | grep -qi 'PNG image data'

      - name: Validate navigation scripts
        run: |
          node --check js/hub-ui.js
          node --check js/app.js
          node --check js/profile-ui.js
          node scripts/verify-data.mjs

      - name: Validate artwork index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          art=json.loads(Path('data/ui-art.json').read_text(encoding='utf-8'))
          assert art['version']==1
          assert len(art['paths']) >= 35, len(art['paths'])
          for key in ('main','ultimate-classic','ultimate-new','avengers','xmen','spider','fantastic-four'):
              assert art['hubs'].get(key), key
          source=Path('js/hub-ui.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'pathArtPrimary' in source
          assert 'hubCardArt' in source
          assert 'data/ui-art.json' in source
          assert 'homeTopActionIcon' in html
          print('Artwork percorsi:',len(art['paths']))
          print('Artwork hub:',len(art['hubs']))
          PY

      - name: Commit visual redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_catalog.py data/ui-art.json js/hub-ui.js css/hub-ui.css css/app.css index.html assets/brand/marvel.png
          git commit -m 'Use real artwork across archive navigation'
          git push
