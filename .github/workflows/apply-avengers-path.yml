name: Apply Avengers reading path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-avengers-path.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build Avengers path
        run: python scripts/build_avengers_data.py

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Verify generated archives
        run: node scripts/verify-data.mjs

      - name: Commit generated Avengers path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/characters/avengers.json data/encoded/avengers.json data/b64/avengers-*.b64 assets/heroes/avengers.svg js/app.js css/app.css index.html scripts/verify-data.mjs scripts/rebuild_character_data.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add Avengers narrative reading path"
          git push
