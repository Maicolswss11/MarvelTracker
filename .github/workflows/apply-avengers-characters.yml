name: Apply Avengers character paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-avengers-characters.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Make ComicsBox character matching robust
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/build_avengers_characters.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('if "/personaggio/" not in href:', 'if "personaggio/" not in href:')
          source = source.replace('h.endswith(" personaggio vision") or h.endswith(" personaggio visione")', 'h.endswith("personaggio vision") or h.endswith("personaggio visione")')
          source = source.replace(
              '("scarlet witch", "wanda maximoff", "maximoff wanda")',
              '("scarlet witch", "scarlet", "wanda maximoff", "maximoff wanda")',
          )
          old = '''    matched: set[str] = set()\n    for href, text in parser.links:\n        for route_id in ROUTES:\n            if person_matches(route_id, href, text):\n                matched.add(route_id)\n    return issue["id"], matched'''
          new = '''    matched: set[str] = set()\n    exact_tokens = {normalize(token) for token in parser.tokens}\n    token_aliases = {\n        "antman": {"ant man", "hank pym", "henry pym", "scott lang", "giant man", "yellowjacket"},\n        "wasp": {"wasp", "janet van dyne", "nadia van dyne", "nadia pym"},\n        "scarletwitch": {"scarlet witch", "scarlet", "wanda maximoff", "wanda"},\n        "vision": {"vision", "visione"},\n        "wonderman": {"wonder man", "wonderman", "simon williams"},\n    }\n    for route_id, aliases in token_aliases.items():\n        if exact_tokens & aliases:\n            matched.add(route_id)\n    for href, text in parser.links:\n        for route_id in ROUTES:\n            if person_matches(route_id, href, text):\n                matched.add(route_id)\n    return issue["id"], matched'''
          if old not in source:
              raise SystemExit('scan_avengers_issue block not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

      - name: Check builder syntax
        run: python -m py_compile scripts/build_avengers_characters.py

      - name: Build character paths
        run: python scripts/build_avengers_characters.py

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Verify all archives
        run: node scripts/verify-data.mjs

      - name: Ensure shared Avengers appearances were found
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path
          for route_id in ('antman','wasp','scarletwitch','vision','wonderman'):
              spec=json.loads(Path(f'data/encoded/{route_id}.json').read_text())
              raw=''.join(Path(p).read_text().strip() for p in spec['sources'])
              data=json.loads(gzip.decompress(base64.b64decode(raw)))
              shared=sum('Vendicatori' in issue.get('sharedWith',[]) for issue in data['issues'])
              print(f'{data["name"]}: {shared} tappe condivise')
              if shared == 0:
                  raise SystemExit(f'{route_id}: nessuna apparizione Vendicatori trovata')

      - name: Commit generated paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/characters/antman.json data/characters/wasp.json data/characters/scarletwitch.json data/characters/vision.json data/characters/wonderman.json \
            data/encoded/antman.json data/encoded/wasp.json data/encoded/scarletwitch.json data/encoded/vision.json data/encoded/wonderman.json \
            data/b64/antman-*.b64 data/b64/wasp-*.b64 data/b64/scarletwitch-*.b64 data/b64/vision-*.b64 data/b64/wonderman-*.b64 \
            assets/heroes/antman.svg assets/heroes/wasp.svg assets/heroes/scarlet-witch.svg assets/heroes/vision.svg assets/heroes/wonder-man.svg \
            js/app.js css/app.css index.html scripts/verify-data.mjs scripts/rebuild_character_data.py scripts/build_avengers_characters.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Populate Avengers character timelines"
          git push
