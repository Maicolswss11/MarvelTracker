name: Apply new Ultimate Universe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ultimate-new.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Align manifest version
        shell: python
        run: |
          from pathlib import Path
          import re
          for path in Path('scripts').glob('*.py'):
              source = path.read_text(encoding='utf-8')
              source = re.sub(r'MANIFEST_VERSION\s*=\s*\d+', 'MANIFEST_VERSION = 11', source)
              source = re.sub(r'manifest\["version"\]\s*=\s*\d+', 'manifest["version"] = 11', source)
              path.write_text(source, encoding='utf-8')
          verify = Path('scripts/verify-data.mjs')
          source = verify.read_text(encoding='utf-8')
          source = re.sub(
              r'assert\.equal\(manifest\.version,\s*\d+,\s*"Il manifest deve usare la versione cache v\d+"\);',
              'assert.equal(manifest.version, 11, "Il manifest deve usare la versione cache v11");',
              source,
          )
          verify.write_text(source, encoding='utf-8')

      - name: Build Earth-6160
        run: python scripts/build_ultimate_new.py

      - name: Validate taxonomy and archives
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path
          manifest=json.loads(Path('data/characters.json').read_text(encoding='utf-8'))
          hubs=json.loads(Path('data/hubs.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('data/ultimate-new-audit.json').read_text(encoding='utf-8'))
          assert manifest['version']==11
          paths={p['id']:p for p in manifest['characters']}
          expected={
              'ultimate-new-universe':126,
              'ultimate-invasion':4,
              'ultimate-new-specials':2,
              'ultimate-new-spiderman':24,
              'ultimate-new-black-panther':24,
              'ultimate-new-xmen':24,
              'ultimate-new-ultimates':24,
              'ultimate-new-wolverine':16,
              'ultimate-incursion':5,
              'ultimate-endgame':3,
          }
          for pid,total in expected.items():
              assert paths[pid]['totalRequired']==total,(pid,paths[pid]['totalRequired'])
          hub=next(h for h in hubs['hubs'] if h['id']=='ultimate-new')
          assert hub.get('status') is None
          assert hub['featuredPath']=='ultimate-new-universe'
          assert hub['groups'][0]['paths']==['ultimate-new-universe']
          assert audit['masterTotal']==126

          def unpack(cid):
              spec=json.loads(Path(f'data/encoded/{cid}.json').read_text(encoding='utf-8'))
              encoded=''.join(Path(src).read_text(encoding='ascii').strip() for src in spec['sources'])
              return json.loads(gzip.decompress(base64.b64decode(encoded)).decode('utf-8'))
          master=unpack('ultimate-new-universe')
          ids=[i['id'] for i in master['issues']]
          assert ids[:5]==['ULTIMATIN:1','ULTIMATIN:2','ULTIMATIN:3','ULTIMATIN:4','ULTIMATEUN:1']
          assert ids.index('ULTIMATEUN:2') < ids.index('ULTMTWOLVP:1')
          assert len(ids)==len(set(ids))==126
          print('Terra-6160 taxonomy — OK')

      - name: Validate JavaScript and all data
        run: |
          node --check js/app.js
          node --check js/hub-ui.js
          node scripts/verify-data.mjs

      - name: Commit new Ultimate Universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/hubs.json data/ultimate-new-audit.json
          git add data/characters/ultimate-*.json data/encoded/ultimate-*.json data/b64/ultimate-*.b64
          git add assets/heroes/ultimate-*.svg scripts/*.py scripts/verify-data.mjs
          git commit -m "Add new Ultimate Universe reading paths"
          git push
