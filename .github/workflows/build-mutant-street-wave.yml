name: Build Elektra Deadpool Cable Magik wave

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-mutant-street-wave.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Add resilient source loading
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/build_mutant_street_wave.py")
          text = path.read_text(encoding="utf-8")
          old = '    loaded, source_errors = street.load_config_sources(config, workers)\n    filtered_roles, filtered_role_errors = filtered_source_roles(config, loaded, workers)\n'
          new = '''    # Loading all 77 ComicsBox series at the same 32-way concurrency used for\n    # story classification can trigger transient throttling. Keep the expensive\n    # classification parallel, but load source series conservatively and retry\n    # failures with backoff before doing thousands of downstream requests.\n    source_workers = min(workers, 8)\n    loaded, source_errors = street.load_config_sources(config, source_workers)\n    retry_delays = (5, 15, 30, 60)\n    for retry, delay in enumerate(retry_delays, 1):\n        if not source_errors:\n            break\n        failed_codes = ", ".join(sorted(source_errors))\n        log(f"Retry sorgenti ComicsBox {retry}/{len(retry_delays)} tra {delay}s: {failed_codes}")\n        __import__("time").sleep(delay)\n        for code in list(source_errors):\n            try:\n                loaded[code] = legacy.load_foreign_series(code)\n                source_errors.pop(code, None)\n            except Exception as error:\n                source_errors[code] = str(error)\n    if source_errors:\n        details = "; ".join(f"{code}: {error}" for code, error in sorted(source_errors.items()))\n        raise RuntimeError(f"ComicsBox source load failed after retries: {details}")\n    log(f"Sorgenti ComicsBox complete: {len(loaded)}/77")\n    filtered_roles, filtered_role_errors = filtered_source_roles(config, loaded, workers)\n'''
          if old not in text:
              raise SystemExit("builder source-load anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate builder
        run: python -m py_compile scripts/build_mutant_street_wave.py

      - name: Build four paths
        env:
          MARVELTRACKER_WORKERS: "32"
        run: python scripts/build_mutant_street_wave.py --workers 32

      - name: Rebuild global catalog
        run: python scripts/build_catalog.py

      - name: Verify character checkpoint
        run: |
          node scripts/verify-mutant-street-wave.mjs
          node scripts/verify-street-wave.mjs
          node scripts/verify-data.mjs

      - name: Commit character checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/characters.json data/hubs.json data/catalog.json \
            data/mutant-street-wave-audit.json data/mutant-street-wave-sources.json \
            data/characters/elektra.json data/characters/deadpool.json \
            data/characters/cable.json data/characters/magik.json \
            assets/heroes/elektra.svg assets/heroes/deadpool.svg \
            assets/heroes/cable.svg assets/heroes/magik.svg \
            scripts/build_mutant_street_wave.py
          if ! git diff --cached --quiet; then
            git commit -m "Add Elektra Deadpool Cable and Magik reading paths"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Harden and extend alternative-edition matcher
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/build_editions_catalog.py")
          text = path.read_text(encoding="utf-8")

          aliases = {
              "elektra": ["elektra", "elektra natchios"],
              "deadpool": ["deadpool", "wade wilson"],
              "cable": ["cable", "nathan summers"],
              "magik": ["magik", "illyana rasputin", "illyana"],
          }
          start = text.index("PATH_ALIASES = {")
          end = text.index("\n}\n\nDETAIL_HINTS", start)
          block = text[start:end]
          additions = []
          for path_id, values in aliases.items():
              if f'"{path_id}":' not in block:
                  additions.append(f'    "{path_id}": [{", ".join(repr(v) for v in values)}],')
          if additions:
              text = text[:end] + "\n" + "\n".join(additions) + text[end:]

          old = '''            auto_generated = old.get("coverageSource") == "auto:first-italian-publication"\n            preserved_coverage = [] if auto_generated else old.get("coverage", [])\n            preserved_source = "" if auto_generated else old.get("coverageSource", "")\n'''
          new = '''            auto_generated = old.get("coverageSource") == "auto:first-italian-publication"\n            # Keep verified automatic coverage as a monotonic baseline: transient\n            # ComicsBox failures may prevent extensions, but can never erase it.\n            preserved_coverage = old.get("coverage", [])\n            preserved_source = old.get("coverageSource", "")\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''    to_scan = [\n        item for item in imported\n        if not item.get("coverage") and should_fetch_detail(f"{item['series']} {item['name']}")\n    ]\n'''
          new = '''    to_scan = [\n        item for item in imported\n        if (not item.get("coverage") or item.get("coverageSource") == "auto:first-italian-publication")\n        and should_fetch_detail(f"{item['series']} {item['name']}")\n    ]\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''    for item in imported:\n        if item.get("coverage"):\n            continue\n        codes = scanned.get(item["id"], [])\n        if not codes:\n            continue\n        identity = f"{item['series']} {item['name']}"\n        candidates = candidates_for_title(identity)\n        matched = [code_to_issue[code] for code in codes if code in code_to_issue]\n        if not matched:\n            continue\n\n        route_union = {path for issue in matched for path in issue.get("paths", [])}\n        if not candidates and len(route_union) == 1:\n            candidates = set(route_union)\n\n        by_path: dict[str, list[str]] = {}\n        for issue in matched:\n            for path in issue.get("paths", []):\n                if path in candidates:\n                    by_path.setdefault(path, []).append(issue["id"])\n\n        item["coverage"] = [\n            {"path": path, "issueIds": list(dict.fromkeys(ids)), "label": item["name"]}\n            for path, ids in sorted(by_path.items()) if ids\n        ]\n        if item["coverage"]:\n            item["coverageSource"] = "auto:first-italian-publication"\n'''
          new = '''    for item in imported:\n        is_auto = item.get("coverageSource") == "auto:first-italian-publication"\n        if item.get("coverage") and not is_auto:\n            continue\n        baseline = item.get("coverage", []) if is_auto else []\n        codes = scanned.get(item["id"], [])\n        if not codes:\n            continue\n        identity = f"{item['series']} {item['name']}"\n        candidates = candidates_for_title(identity)\n        matched = [code_to_issue[code] for code in codes if code in code_to_issue]\n        if not matched:\n            continue\n\n        route_union = {path for issue in matched for path in issue.get("paths", [])}\n        if not candidates and len(route_union) == 1:\n            candidates = set(route_union)\n\n        by_path: dict[str, list[str]] = {}\n        for coverage in baseline:\n            path_id = coverage.get("path")\n            if path_id and coverage.get("issueIds"):\n                by_path.setdefault(path_id, []).extend(coverage["issueIds"])\n        for issue in matched:\n            for path_id in issue.get("paths", []):\n                if path_id in candidates:\n                    by_path.setdefault(path_id, []).append(issue["id"])\n\n        merged_coverage = [\n            {"path": path_id, "issueIds": list(dict.fromkeys(ids)), "label": item["name"]}\n            for path_id, ids in sorted(by_path.items()) if ids\n        ]\n        if merged_coverage:\n            item["coverage"] = merged_coverage\n            item["coverageSource"] = "auto:first-italian-publication"\n'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Regenerate alternative editions
        run: python scripts/build_editions_catalog.py

      - name: Verify alternative editions
        shell: bash
        run: |
          python scripts/check_alternative_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/editions.json').read_text(encoding='utf-8'))
          minimums = {'daredevil': (57, 332), 'wolverine-616': (20, 119)}
          for path_id, (min_editions, min_issues) in minimums.items():
              matches, issues = 0, set()
              for edition in payload.get('editions', []):
                  covs = [c for c in edition.get('coverage', []) if c.get('path') == path_id and c.get('issueIds')]
                  if covs:
                      matches += 1
                      for cov in covs:
                          issues.update(cov['issueIds'])
              print(f'{path_id}: {matches} editions / {len(issues)} issues')
              if matches < min_editions or len(issues) < min_issues:
                  raise SystemExit(f'alternative coverage regression: {path_id}')
          PY

      - name: Commit alternative editions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editions.json scripts/build_editions_catalog.py
          if ! git diff --cached --quiet; then
            git commit -m "Extend alternative editions for mutant street paths"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
