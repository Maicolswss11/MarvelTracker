name: Inspect mutant-street wave state

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/discover-mutant-wave.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check current alternative coverage and configured sources
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path('.')
          payload = json.loads((root/'data/editions.json').read_text(encoding='utf-8'))
          for path_id in ('daredevil','wolverine-616'):
              editions = []
              issues = set()
              for edition in payload.get('editions', []):
                  covs = [c for c in edition.get('coverage', []) if c.get('path') == path_id and c.get('issueIds')]
                  if covs:
                      editions.append(edition.get('id'))
                      for cov in covs: issues.update(cov.get('issueIds', []))
              print(f'CURRENT {path_id}: {len(editions)} editions / {len(issues)} issues')

          sys.path.insert(0, str(root/'scripts'))
          import build_street_wave as street
          config = json.loads((root/'data/mutant-street-wave-sources.json').read_text(encoding='utf-8'))
          loaded, errors = street.load_config_sources(config, 14)
          print(f'SOURCES: {len(loaded)} loaded / {len(errors)} errors')
          for code, error in sorted(errors.items()):
              print(f'SOURCE_ERROR {code}: {error}')
          if errors:
              raise SystemExit(1)
          PY
