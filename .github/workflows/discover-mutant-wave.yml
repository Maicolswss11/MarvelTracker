name: Inspect ComicsBox character chronologies

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/discover-mutant-wave.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect character endpoints
        shell: python
        run: |
          import re
          from urllib.request import Request, urlopen

          for name in ("elektra", "deadpool", "cable", "magik"):
              for url in (f"https://www.comicsbox.it/characters.php?name={name}", f"https://www.comicsbox.it/personaggio/{name}"):
                  try:
                      source = urlopen(Request(url, headers={"User-Agent":"MarvelTracker data maintenance/6.0"}), timeout=30).read().decode("utf-8", errors="replace")
                      title = re.search(r"<title>(.*?)</title>", source, re.I | re.S)
                      markers = len(re.findall(r"Prima\s+pubblicazione\s*:", source, re.I))
                      cameos = len(re.findall(r"fa\s+solo\s+una\s+comparsa", source, re.I))
                      albo_links = len(re.findall(r"(?:/albo/|albo/)[^\"'?#/<]+", source, re.I))
                      clean_title = re.sub(r"<[^>]+>", "", title.group(1)).strip() if title else ""
                      print(f"{name}: {url}")
                      print(f"  title={clean_title!r} bytes={len(source)} chronology={markers} cameos={cameos} albo_links={albo_links}")
                  except Exception as exc:
                      print(f"{name}: {url} ERROR {exc!r}")
