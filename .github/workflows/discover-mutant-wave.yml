name: Discover Elektra Deadpool Cable Magik sources

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/discover-mutant-wave.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cable index links
        shell: python
        run: |
          import html
          import re
          from urllib.request import Request, urlopen

          url = "https://www.comicsbox.it/comicsusa?l=C"
          source = urlopen(Request(url, headers={"User-Agent": "MarvelTracker data maintenance/6.0"}), timeout=45).read().decode("utf-8", errors="replace")
          for match in re.finditer(r'href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', source, re.I | re.S):
              href = html.unescape(match.group(1))
              title = " ".join(html.unescape(re.sub(r"<[^>]+>", "", match.group(2))).split())
              if "CABLE" in title.upper():
                  print(f"{title:72} | {href}")
