name: Fix hub navigation freeze

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hub-freeze.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch observer loop
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('js/hub-ui.js')
          source = path.read_text(encoding='utf-8')

          old_add = '  document.body.classList.add("hubUiEnabled");'
          new_add = '  if(!document.body.classList.contains("hubUiEnabled")) document.body.classList.add("hubUiEnabled");'
          if old_add in source:
              source = source.replace(old_add, new_add, 1)
          elif new_add not in source:
              raise SystemExit('ensureHomeExplorer class update not found')

          old_observer = '    new MutationObserver(()=>refresh()).observe(document.body,{attributes:true,attributeFilter:["class"]});'
          new_observer = '''    let lastHomeActive = document.body.classList.contains("homeActive");
    new MutationObserver(()=>{
      const homeActive = document.body.classList.contains("homeActive");
      if(homeActive === lastHomeActive) return;
      lastHomeActive = homeActive;
      setTimeout(refresh,0);
    }).observe(document.body,{attributes:true,attributeFilter:["class"]});'''
          if old_observer in source:
              source = source.replace(old_observer, new_observer, 1)
          elif 'let lastHomeActive = document.body.classList.contains("homeActive")' not in source:
              raise SystemExit('body MutationObserver not found')

          path.write_text(source,encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'js/hub-ui\.js\?v=\d+', 'js/hub-ui.js?v=3', html)
          html = re.sub(r'css/hub-ui\.css\?v=\d+', 'css/hub-ui.css?v=3', html)
          index.write_text(html,encoding='utf-8')

      - name: Validate JavaScript
        run: |
          node --check js/hub-ui.js
          node --check js/app.js

      - name: Guard regression
        shell: python
        run: |
          from pathlib import Path
          source = Path('js/hub-ui.js').read_text(encoding='utf-8')
          assert 'new MutationObserver(()=>refresh())' not in source
          assert 'if(!document.body.classList.contains("hubUiEnabled"))' in source
          assert 'if(homeActive === lastHomeActive) return;' in source
          print('Hub observer loop guard — OK')

      - name: Verify archives
        run: node scripts/verify-data.mjs

      - name: Commit freeze fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/hub-ui.js index.html
          git commit -m "Fix navigation observer freeze"
          git push
