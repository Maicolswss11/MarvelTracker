name: Audit Doctor Strange route

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-doctor-strange-audit.yml"
      - "scripts/build_doctor_strange_audit.py"
      - "scripts/build_doctor_strange_audit_v2.py"
      - "scripts/refine_doctor_strange_story_features.py"
      - "scripts/patch_doctor_strange_editions.py"
      - "scripts/verify-doctor-strange-audit.mjs"
      - "js/editions.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-doctor-strange-audit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build audited Doctor Strange route
        run: python scripts/build_doctor_strange_audit_v2.py --workers 20

      - name: Refine classic route to exact story features
        run: python scripts/refine_doctor_strange_story_features.py --phase route --workers 20

      - name: Rebuild physical catalog
        run: python scripts/build_catalog.py

      - name: Rebuild alternative-edition base
        run: python scripts/build_editions_catalog.py

      - name: Apply exact Doctor Strange story-feature alternatives
        run: python scripts/patch_doctor_strange_editions.py --workers 16

      - name: Verify Doctor Strange audit
        run: node scripts/verify-doctor-strange-audit.mjs

      - name: Verify alternative coverage and global data
        run: |
          python scripts/check_alternative_coverage.py
          node scripts/verify-data.mjs

      - name: Commit audited data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/characters.json \
            data/catalog.json \
            data/editions.json \
            data/characters/doctor-strange.json \
            data/doctor-strange-audit.json \
            data/doctor-strange-alternatives-audit.json
          if git diff --cached --quiet; then
            echo "No Doctor Strange data changes to commit"
          else
            git commit -m "Refine Doctor Strange to exact story features"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
