name: Patch hub Home levels navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_hub_home_levels.py'
      - '.github/workflows/patch-hub-home-levels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch navigation
        run: |
          python -m py_compile scripts/patch_hub_home_levels.py
          python scripts/patch_hub_home_levels.py
          node --check js/hub-ui.js
          node --check js/app.js
          node scripts/verify-data.mjs

      - name: Validate explicit level-home action
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path('js/hub-ui.js').read_text(encoding='utf-8')
          css = Path('css/hub-ui.css').read_text(encoding='utf-8')
          assert js.count('← Home livelli') >= 2
          assert 'class="hubHomeLevelsBtn"' in js
          assert 'exploreButton.addEventListener("click",()=>goToExplorer(null))' in js
          assert '.hubBreadcrumb .hubHomeLevelsBtn' in css
          assert '.trackerHubBreadcrumb .hubHomeLevelsBtn' in css
          print('Home livelli navigation — OK')
          PY

      - name: Commit generated UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/hub-ui.js css/hub-ui.css
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add explicit Home levels navigation"
          git push origin HEAD:main
